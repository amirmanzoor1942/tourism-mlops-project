name: Tourism Project Pipeline

on:
  push:
    branches: [main]
    paths:
      - "tourism_project/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourism-pipeline-main
  cancel-in-progress: false

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install registration dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.4.6

      - name: Register dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload validated dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preparation dependencies
        run: python -m pip install -r tourism_project/deployment/requirements.txt

      - name: Download validated dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Prepare training and testing data
        run: python tourism_project/model_building/prep.py

      - name: Upload data splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed/*.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: python -m pip install -r tourism_project/requirements.txt

      - name: Download data splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed

      - name: Train and evaluate model
        run: python tourism_project/model_building/train.py

      - name: Check app syntax and saved model
        run: |
          python -m py_compile tourism_project/deployment/app.py
          python -c "import joblib; m = joblib.load('tourism_project/deployment/model.joblib'); print('Model loaded successfully. Predictors:', len(m.feature_names_in_))"

      - name: Preserve experiment tracking and reports
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: |
            tourism_project/mlruns/
            tourism_project/reports/
            tourism_project/deployment/model.joblib
          if-no-files-found: error
          retention-days: 30

      - name: Commit trained model and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/model.joblib tourism_project/reports/

          if git diff --cached --quiet; then
            echo "No model or report changes to commit."
          else
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$(git rev-parse HEAD)" ]; then
              echo "The main branch changed during training. Run the workflow again."
              exit 1
            fi

            git commit -m "Update trained model and evaluation reports [skip ci]"
            git push origin HEAD:main
          fi
